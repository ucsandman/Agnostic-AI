<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agnostic AI — Fact & Rule Recall</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --rule-tag: #e3b341;
      --fact-tag: #388bfd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 24px; font-weight: 600; }
    .subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
    .search-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 20px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }
    .results-list { display: flex; flex-direction: column; gap: 12px; }
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .result-title { font-size: 16px; font-weight: 600; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .badge-rule { background: rgba(227, 179, 65, 0.2); color: var(--rule-tag); }
    .badge-fact { background: rgba(56, 139, 253, 0.2); color: var(--fact-tag); }
    .result-content {
      font-size: 14px;
      color: #c9d1d9;
      white-space: pre-wrap;
      font-family: inherit;
    }
    .result-source { font-size: 12px; color: var(--text-muted); margin-top: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Agnostic Fact & Rule Recall</h1>
      <div class="subtitle">Search live memory facts, learned rules, and past decisions across all agents</div>
    </header>

    <input type="text" id="query-input" class="search-box" placeholder="Type to search rules, constraints, repo facts..." autofocus>

    <div id="results-list" class="results-list"></div>
  </div>

  <script>
    const input = document.getElementById('query-input');
    const listEl = document.getElementById('results-list');

    let debounceTimer = null;
    input.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => doSearch(input.value), 150);
    });

    async function doSearch(query) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        render(data.results);
      } catch (err) {
        listEl.innerHTML = '<div style="color: var(--text-muted)">Error fetching results.</div>';
      }
    }

    function render(results) {
      if (!results || results.length === 0) {
        listEl.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 32px;">No matching facts or rules found.</div>';
        return;
      }
      listEl.innerHTML = results.map(r => `
        <div class="result-card">
          <div class="result-header">
            <span class="result-title">${escapeHtml(r.title)}</span>
            <span class="badge ${r.type === 'rule' ? 'badge-rule' : 'badge-fact'}">${r.type}</span>
          </div>
          <div class="result-content">${escapeHtml(r.content)}</div>
          <div class="result-source">Source: ${escapeHtml(r.source)}</div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    doSearch('');
  </script>
</body>
</html>

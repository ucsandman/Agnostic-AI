name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          # The project is developed on Windows (mklink /J junctions, CRLF, .cmd
          # entry points); one Windows leg keeps those paths honest.
          - { os: windows-latest, python: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      # The repo is LF-only and docs:check compares bytes, so the Windows runner
      # must not translate line endings on checkout.
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Python tests
        run: python -m pytest tests/ -q

      - name: Engine test suite
        run: node engine/tests/run-all.cjs

      - name: Sync regression tests
        run: node engine/tests/reg-sync.cjs

      - name: Security-hook regression tests
        run: node engine/tests/reg-hooks.cjs

      - name: Generated docs are current
        run: node engine/docs/targets-doc.cjs --check && python -m agent.orchestration.docs --check

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Python tests
        run: python -m pytest tests/ -q

      - name: Engine test suite
        run: node engine/tests/run-all.cjs

      - name: Sync regression tests
        run: node engine/tests/reg-sync.cjs

      - name: Security-hook regression tests
        run: node engine/tests/reg-hooks.cjs

      - name: Generated docs are current
        run: node engine/docs/targets-doc.cjs --check
